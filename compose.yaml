services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-yphish}
      POSTGRES_USER: ${DATABASE_USER:-yphish}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db
      PRIVATE_ARTIFACT_ROOT: /app/private_artifacts
      CLASSIFIER_MODEL_ROOT: /app/model_artifacts
      CLASSIFIER_DATASET_SELECTION_FILE: /app/datasets/selection.json
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
      GOOGLE_INGESTION_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - private_artifacts:/app/private_artifacts
      - model_artifacts:/app/model_artifacts
      - ./secrets:/run/secrets:ro
      - ./snapshots:/app/snapshots:ro
      - ./datasets:/app/datasets:ro

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: yphish
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db
      PRIVATE_ARTIFACT_ROOT: /app/private_artifacts
      CLASSIFIER_MODEL_ROOT: /app/model_artifacts
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
      GOOGLE_INGESTION_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
      GOOGLE_RESPONSE_SERVICE_ACCOUNT_FILE: /run/response-secrets/google-response-service-account.json
      CELERY_BROKER_URL: amqp://yphish:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672//
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      web:
        condition: service_healthy
    command: celery -A config worker -l WARNING --concurrency=2
    stop_grace_period: 6m
    volumes:
      - private_artifacts:/app/private_artifacts
      - model_artifacts:/app/model_artifacts
      - ./secrets:/run/secrets:ro
      - ./response_secrets:/run/response-secrets:ro

  beat:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db
      CELERY_BROKER_URL: amqp://yphish:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672//
    depends_on:
      rabbitmq:
        condition: service_healthy
      web:
        condition: service_healthy
    command: celery -A config beat -l WARNING --schedule /tmp/celerybeat-schedule

volumes:
  postgres_data:
  private_artifacts:
  model_artifacts:
